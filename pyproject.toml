[project]
name = "rtar"
description = "RTAR (REALITY Auto Reply Tool) - AI-powered automated chat system for REALITY App live streams"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "RTAR Team" }]

dependencies = [
    # Core async framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    
    # WebSocket
    "websockets>=12.0",
    
    # OpenAI client
    "openai>=1.0.0",
    
    # MCP SDK
    "mcp>=1.0.0",
    
    # Data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # Configuration
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18.0",
    
    # WebUI
    "gradio>=4.0.0",
    
    # Utilities
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
rtar = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "ui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
